name: Android CI & Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore debug.keystore from debug.keystore.base64
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          chmod +x gradlew

      - name: Verify Gradle Wrapper Version
        run: ./gradlew --version

      - name: Run Unit & Robolectric Tests (55 Tests)
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicVideoStudio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
